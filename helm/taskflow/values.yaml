global:
  existingSecret: taskflow-secrets

  imagePullSecrets:
    - name: nexus-pull-credentials

backend:
  replicaCount: 2
  image:
    repository: nexus.server:8082/taskflow-backend
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2
  image:
    repository: nexus.server:8082/taskflow-frontend
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 512Mi
  vpa:
    enabled: true
    updateMode: "Auto"

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: tasks
  username: taskflow
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    existingClaim: redis-data
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CACHE_TTL_SECONDS: "60"
  DB_MAX_RETRIES: "10"
  DB_RETRY_DELAY_SECONDS: "3"
  LOG_LEVEL: "INFO"
  APP_VERSION: "1.0.0"

ingress:
  enabled: true
  className: traefik
  host: ""
  path: /
  pathType: Prefix

{{- if .Values.frontend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: frontend-vpa
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  updatePolicy:
    updateMode: {{ .Values.frontend.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: frontend
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 16Mi
        maxAllowed:
          cpu: 200m
          memory: 384Mi
{{- end }}

---
- name: Create private Argo CD bootstrap directory
  ansible.builtin.file:
    path: "{{ argocd_work_dir }}"
    state: directory
    owner: "{{ argocd_owner }}"
    group: "{{ argocd_owner }}"
    mode: "0700"

- name: Create Argo CD namespace
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig={{ argocd_kubeconfig }}
      create namespace {{ argocd_namespace }}
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"
  register: argocd_namespace_create
  changed_when: "'created' in argocd_namespace_create.stdout"
  failed_when: >-
    argocd_namespace_create.rc != 0 and
    'AlreadyExists' not in argocd_namespace_create.stderr

- name: Check that the Nexus Docker configuration exists
  ansible.builtin.stat:
    path: "{{ argocd_runtime_docker_config }}"
  register: argocd_docker_config

- name: Assert that the Nexus Docker configuration is available
  ansible.builtin.assert:
    that:
      - argocd_docker_config.stat.exists
      - argocd_docker_config.stat.isreg
    fail_msg: >-
      Nexus Docker credentials were not found at
      {{ argocd_runtime_docker_config }}.
      Log in to Nexus as {{ argocd_owner }} first.

- name: Create or update Nexus image-pull secret for Argo CD
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ argocd_kubectl_binary }}
    --kubeconfig={{ argocd_kubeconfig }}
    --namespace={{ argocd_namespace }}
    create secret generic {{ argocd_image_pull_secret }}
    --from-file=.dockerconfigjson={{ argocd_runtime_docker_config }}
    --type=kubernetes.io/dockerconfigjson
    --dry-run=client -o yaml |
    {{ argocd_kubectl_binary }}
    --kubeconfig={{ argocd_kubeconfig }}
    apply -f -
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"
  no_log: true

- name: Render Argo CD ServiceAccounts with the Nexus pull secret
  ansible.builtin.template:
    src: serviceaccounts-nexus.yaml.j2
    dest: "{{ argocd_serviceaccounts_manifest }}"
    owner: "{{ argocd_owner }}"
    group: "{{ argocd_owner }}"
    mode: "0600"
  become: true
  become_user: "{{ argocd_owner }}"

- name: Apply Argo CD ServiceAccounts with the Nexus pull secret
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig={{ argocd_kubeconfig }}
      --namespace={{ argocd_namespace }}
      apply
      --server-side
      --field-manager=taskflow-registry-auth
      -f {{ argocd_serviceaccounts_manifest }}
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"

- name: Download the pinned official Argo CD manifest
  ansible.builtin.get_url:
    url: "{{ argocd_manifest_url }}"
    dest: "{{ argocd_source_manifest }}"
    owner: "{{ argocd_owner }}"
    group: "{{ argocd_owner }}"
    mode: "0600"
  become: true
  become_user: "{{ argocd_owner }}"

- name: Create a Nexus-rendered Argo CD manifest
  ansible.builtin.copy:
    src: "{{ argocd_source_manifest }}"
    dest: "{{ argocd_rendered_manifest }}"
    remote_src: true
    owner: "{{ argocd_owner }}"
    group: "{{ argocd_owner }}"
    mode: "0600"
  become: true
  become_user: "{{ argocd_owner }}"

- name: Rewrite Argo CD image to use Nexus
  ansible.builtin.replace:
    path: "{{ argocd_rendered_manifest }}"
    regexp: "{{ argocd_upstream_image | regex_escape }}"
    replace: "{{ argocd_nexus_image }}"

- name: Rewrite Dex image to use Nexus
  ansible.builtin.replace:
    path: "{{ argocd_rendered_manifest }}"
    regexp: "{{ argocd_dex_upstream_image | regex_escape }}"
    replace: "{{ argocd_dex_nexus_image }}"

- name: Rewrite Redis image to use Nexus
  ansible.builtin.replace:
    path: "{{ argocd_rendered_manifest }}"
    regexp: "{{ argocd_redis_upstream_image | regex_escape }}"
    replace: "{{ argocd_redis_nexus_image }}"

- name: Apply the Nexus-rendered Argo CD manifest
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig={{ argocd_kubeconfig }}
      --namespace={{ argocd_namespace }}
      apply
      --server-side
      --field-manager=taskflow-ansible
      --force-conflicts
      -f {{ argocd_rendered_manifest }}
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"
  register: argocd_apply

- name: Wait for Argo CD Deployments to become available
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig={{ argocd_kubeconfig }}
      --namespace={{ argocd_namespace }}
      wait --for=condition=Available deployment --all
      --timeout={{ argocd_wait_timeout }}
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"

- name: Wait for Argo CD application controller StatefulSet
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig={{ argocd_kubeconfig }}
      --namespace={{ argocd_namespace }}
      rollout status statefulset/argocd-application-controller
      --timeout={{ argocd_wait_timeout }}
  become: true
  become_user: "{{ argocd_owner }}"
  environment:
    HOME: "{{ argocd_owner_home }}"

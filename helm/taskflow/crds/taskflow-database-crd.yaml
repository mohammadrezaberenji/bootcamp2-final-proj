apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: taskflowdatabases.taskflow.io
spec:
  conversion:
    strategy: None
  group: taskflow.io
  names:
    kind: TaskFlowDatabase
    listKind: TaskFlowDatabaseList
    plural: taskflowdatabases
    shortNames:
    - tfdb
    singular: taskflowdatabase
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              databaseName:
                minLength: 1
                type: string
              engine:
                enum:
                - postgresql
                type: string
              storageSize:
                pattern: ^[1-9][0-9]*(Mi|Gi)$
                type: string
            required:
            - engine
            - databaseName
            - storageSize
            type: object
        type: object
    served: true
    storage: true

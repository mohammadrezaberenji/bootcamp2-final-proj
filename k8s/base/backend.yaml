apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: nexus.server:8082/taskflow-backend:1.0.0

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: taskflow-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: database-url

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: redis-password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskflow

spec:
  selector:
    app: backend

  ports:
    - port: 8000
      targetPort: 8000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    kubernetes.io/change-cause: {{ printf "frontend image: %s:%s" .Values.frontend.image.repository (.Values.frontend.image.tag | toString) | quote }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: frontend
          {{ if .Values.frontend.image.digest }}
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.digest }}"
          {{ else }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          {{ end }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.frontend.service.port }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.service.port }}
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
